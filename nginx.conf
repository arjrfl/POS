server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed build assets (filename encodes a content hash) — safe to cache
  # forever, a new deploy always produces new filenames.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Service worker + its Workbox chunk, and the PWA manifest, must always be
  # revalidated — these are the only things standing between a deploy landing
  # on disk and a browser tab actually noticing it. Any caching here can leave
  # a terminal serving a stale app shell indefinitely.
  location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Serve React PWA (SPA — all routes fall back to index.html)
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }

  # Proxy API to FastAPI backend
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Proxy WebSocket to FastAPI backend
  location /ws/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
}
